<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: required by Apple App Store, Google Play, Huawei guidelines -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Content Security Policy — prevents XSS, clickjacking, and mixed content -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://app.base44.app https://*.base44.app wss://app.base44.app wss://*.base44.app; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" />
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Primary SEO -->
    <title>OpFin — Smart Finance. Simple Solutions.</title>
    <meta name="description" content="OpFin is Uganda's mobile-first financial platform offering savings, micro-loans, insurance, P2P lending and AI-powered budgeting for everyday earners." />
    <meta name="keywords" content="OpFin, Uganda, mobile banking, savings, micro loans, insurance, fintech, East Africa, financial inclusion" />
    <meta name="author" content="OpFin Technologies Ltd" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.opfin.ug/" />

    <!-- Open Graph / Social sharing (required for app stores & marketing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.opfin.ug/" />
    <meta property="og:title" content="OpFin — Smart Finance. Simple Solutions." />
    <meta property="og:description" content="Fast and simple mobile financial solutions built for everyday life in Uganda — savings, loans, insurance and more." />
    <meta property="og:image" content="https://media.base44.com/images/public/6a0ed744d2266f7b5226f8a2/17a664fad_ChatGPTImageMay26202602_42_53PM.png" />
    <meta property="og:locale" content="en_UG" />
    <meta property="og:site_name" content="OpFin" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpFin — Smart Finance. Simple Solutions." />
    <meta name="twitter:description" content="Uganda's mobile-first financial platform for savings, loans, insurance & investments." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/6a0ed744d2266f7b5226f8a2/17a664fad_ChatGPTImageMay26202602_42_53PM.png" />

    <!-- PWA / Mobile App compliance (Apple App Store, Google Play, Huawei) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D1BFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpFin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="OpFin" />

    <!-- Security: CSP prevents XSS — ISO/IEC 27001 A.14.2.5 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a0ed744d2266f7b5226f8a2/17a664fad_ChatGPTImageMay26202602_42_53PM.png" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/6a0ed744d2266f7b5226f8a2/17a664fad_ChatGPTImageMay26202602_42_53PM.png" />

    <!-- Accessibility: skip-link target is in body -->
  </head>
  <body>
    <!-- Skip to main content — WCAG 2.1 AA / Apple accessibility guideline -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[9999] focus:bg-white focus:text-[#0D1BFF] focus:font-bold focus:px-4 focus:py-2 focus:rounded-lg focus:shadow-lg"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
